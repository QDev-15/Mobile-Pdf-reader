# Extra R8 rules for AndroidR8ObfuscationMode=private-members (private fields/methods get renamed).
# Anything that finds private members BY NAME at run time must be kept, or it dies with NoSuchFieldException.

# protobuf-lite (Cronet httpflags, Unity Ads gateway protos, androidx.datastore): MessageSchema looks the generated
# fields up by name (getDeclaredField("flags_")). Seen on an emulator: "Field flags_ for org.chromium.net.httpflags.Flags not found".
-keepclassmembers class * extends com.google.protobuf.GeneratedMessageLite {
    <fields>;
}
-keepclassmembers class * extends com.google.protobuf.GeneratedMessageLite$ExtendableMessage {
    <fields>;
}
# Tink bundles its own shaded copy (keyset protos, used by androidx.security / MAUI SecureStorage).
-keepclassmembers class * extends com.google.crypto.tink.shaded.protobuf.GeneratedMessageLite {
    <fields>;
}
-keepclassmembers class * extends com.google.crypto.tink.shaded.protobuf.GeneratedMessageLite$ExtendableMessage {
    <fields>;
}
